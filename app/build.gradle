plugins {
    id 'com.google.devtools.ksp' version '2.3.11'
}

apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")

def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace = 'com.eagskunst.emmanuel.gamingnews'

    if (hasKeystoreProperties) {
        signingConfigs {
            config {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }
    compileSdk = 36
    defaultConfig {
        applicationId = "com.eagskunst.emmanuel.gamingnews"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode = 16
        versionName = "2.0.0-beta01"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        if (hasKeystoreProperties) {
            signingConfig = signingConfigs.config
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties) {
                signingConfig = signingConfigs.config
            }
        }
        debug {
            if (hasKeystoreProperties) {
                signingConfig = signingConfigs.config
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.prof18.rssparser:rssparser:5.0.3'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'com.google.dagger:dagger:2.60.1'
    // AGP 9's built-in Kotlin is incompatible with kapt, so Dagger's annotation processing
    // uses KSP (which works for both the remaining Java sources and new Kotlin sources).
    ksp 'com.google.dagger:dagger-compiler:2.60.1'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
}

apply plugin: 'com.google.gms.google-services'
// REQUIRED: Google's new Maven repo is required for the latest
// support library that is compatible with Android 8.0

