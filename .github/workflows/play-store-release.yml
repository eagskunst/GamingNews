name: Release to Play Store

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    name: Build, test, and upload release AAB
    # ubuntu-22.04: android-emulator-runner hangs on ubuntu-24.04 runners
    # (ReactiveCircus/android-emulator-runner#478)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          mkdir -p .signing
          printf '%s\n' "$SIGNING_KEYSTORE_BASE64" | base64 -d > .signing/release.keystore
          cat > keystore.properties <<EOF
          storeFile=.signing/release.keystore
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF

      - name: Write local.properties
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          cat > local.properties <<EOF
          twitch.client.id=$TWITCH_CLIENT_ID
          twitch.client.secret=$TWITCH_CLIENT_SECRET
          EOF

      - name: Validate tag version against build.gradle.kts
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          BUILD_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
            echo "Error: tag version ($TAG_VERSION) does not match versionName ($BUILD_VERSION) in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run instrumented tests
        id: instrumented
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        timeout-minutes: 20
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Report instrumented test failure
        if: steps.instrumented.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ vars.ISSUE_ASSIGNEE || github.repository_owner }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -n "$VERSION" ]; then
            TITLE="Instrumented tests failed for release v$VERSION"
          else
            TITLE="Instrumented tests failed for workflow run ${{ github.ref_name }}"
          fi
          gh issue create \
            --title "$TITLE" \
            --body "The instrumented test step failed in the Play Store release workflow. Review the logs here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee "$ASSIGNEE"
          exit 1

      - name: Build release AAB
        run: ./gradlew :app:bundleRelease

      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.eagskunst.emmanuel.gamingnews
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew
